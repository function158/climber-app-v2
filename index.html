<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climber.IO.</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react,env">
        // Supabase config
        window.supabaseUrl = 'https://avhvihbhitupdmfbavry.supabase.co';
        window.supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2aHZpaGJoaXR1cGRtZmJhdnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4ODUzOTAsImV4cCI6MjA3NjQ2MTM5MH0.0r208gHMl8m3AvWemSR5e8Ok_Zbl0VRK7LdGeg2fb9s';
        
        if (!window.supabase) {
            console.error('Supabase SDK kunne ikke indlæses. Tjek CDN-scriptet i <head>.');
        }
        const supabase = window.supabase && window.supabase.createClient(window.supabaseUrl, window.supabaseKey);

        const { useState, useEffect } = React;

        // Lucide icons fallback
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
                TrendingUp: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
                Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
                Target: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>,
                Loader2: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>,
                Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
                Home: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
                Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
                Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
                X: () => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            };
            return icons[name] ? icons[name]() : null;
        };

        // Parse duration to minutes
        const parseDuration = (duration) => {
            if (!duration) return 0;
            
            const hoursMatch = duration.match(/(\d+)\s*(t|time|timer|h|hour|hours)/i);
            const minutesMatch = duration.match(/(\d+)\s*(m|min|minut|minutter|minutes?)/i);
            
            const hours = hoursMatch ? parseInt(hoursMatch[1]) : 0;
            const minutes = minutesMatch ? parseInt(minutesMatch[1]) : 0;
            
            return hours * 60 + minutes;
        };

        // Color difficulty order (hardest first)
        const colorOrder = ['Sort', 'Rød', 'Lilla', 'Blå', 'Grøn', 'Orange', 'Gul', 'Hvid', 'Pink'];

        const BoulderingTracker = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [sessions, setSessions] = useState([]);
            const [showNewSession, setShowNewSession] = useState(false);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [timePeriod, setTimePeriod] = useState('week'); // 'week', 'month', 'year'
            const [currentSession, setCurrentSession] = useState({
                date: new Date().toISOString().split('T')[0],
                location: '',
                duration: '',
                exercises: [],
                routes: []
            });
            const [newExercise, setNewExercise] = useState('');
            const [newRoute, setNewRoute] = useState({ color: '', number: '', attempts: '', note: '' });
            const [selectedExercise, setSelectedExercise] = useState('');
            const [exerciseReps, setExerciseReps] = useState('');
            const [editingSessionId, setEditingSessionId] = useState(null);
            const [editSession, setEditSession] = useState(null);
            const [updating, setUpdating] = useState(false);

            const colors = ['Grøn', 'Gul', 'Orange', 'Blå', 'Lilla', 'Rød', 'Sort', 'Hvid', 'Pink'];
            
            // Almindelige klatre-øvelser
            const commonExercises = [
                'Pull ups', 'Dips', 'External rotation', 'Hangboard', 
                'Core øvelser', 'Fingerstyrke', 'Push ups', 'Plank'
            ];

            useEffect(() => {
                loadSessions();
            }, []);

            const loadSessions = async () => {
                setLoading(true);
                try {
                    const { data, error } = await supabase
                        .from('sessions')
                        .select('*')
                        .order('date', { ascending: false });
                    
                    if (!error) {
                        setSessions(sortSessions(data));
                    } else {
                        console.error('Error loading sessions:', error);
                    }
                } catch (error) {
                    console.error('Error loading sessions:', error);
                }
                setLoading(false);
            };

            const sortSessions = (list) => {
                if (!Array.isArray(list)) return [];
                return [...list].sort((a, b) => {
                    const aDraft = !a?.location || !a?.duration;
                    const bDraft = !b?.location || !b?.duration;
                    if (aDraft !== bDraft) return aDraft ? -1 : 1;
                    const aDate = a?.date ? new Date(a.date).getTime() : 0;
                    const bDate = b?.date ? new Date(b.date).getTime() : 0;
                    return bDate - aDate; // newest first
                });
            };

            const addExercise = () => {
                if (newExercise.trim()) {
                    setCurrentSession({
                        ...currentSession,
                        exercises: [...currentSession.exercises, newExercise]
                    });
                    setNewExercise('');
                }
            };

            const addExerciseWithReps = (exercise, reps) => {
                if (exercise && reps) {
                    const exerciseText = `${exercise}: ${reps} reps`;
                    setCurrentSession({
                        ...currentSession,
                        exercises: [...currentSession.exercises, exerciseText]
                    });
                    setSelectedExercise('');
                    setExerciseReps('');
                }
            };

            const addRoute = () => {
                if (newRoute.color) {
                    setCurrentSession({
                        ...currentSession,
                        routes: [...currentSession.routes, { ...newRoute }]
                    });
                    setNewRoute({ color: '', number: '', attempts: '', note: '' });
                }
            };

            const saveSession = async () => {
                if (currentSession.location && currentSession.duration) {
                    setSaving(true);
                    try {
                        const { data: inserted, error } = await supabase
                            .from('sessions')
                            .insert(currentSession)
                            .select()
                            .single();

                        if (!error) {
                            setSessions(sortSessions([inserted, ...sessions]));
                            setCurrentSession({
                                date: new Date().toISOString().split('T')[0],
                                location: '',
                                duration: '',
                                exercises: [],
                                routes: []
                            });
                            setShowNewSession(false);
                            setCurrentPage('sessions');
                        } else {
                            console.error('Error saving session:', error);
                            alert('Fejl ved gemning af session. Tjek din internetforbindelse.');
                        }
                    } catch (error) {
                        console.error('Error saving session:', error);
                        alert('Fejl ved gemning af session. Tjek din internetforbindelse.');
                    }
                    setSaving(false);
                }
            };

            const saveDraftSession = async () => {
                setSaving(true);
                try {
                    const { data: inserted, error } = await supabase
                        .from('sessions')
                        .insert(currentSession)
                        .select()
                        .single();

                    if (!error) {
                        setSessions(sortSessions([inserted, ...sessions]));
                        setCurrentSession({
                            date: new Date().toISOString().split('T')[0],
                            location: '',
                            duration: '',
                            exercises: [],
                            routes: []
                        });
                        setShowNewSession(false);
                        setCurrentPage('sessions');
                    } else {
                        console.error('Error saving draft session:', error);
                        alert('Fejl ved gemning af kladde. Tjek din internetforbindelse.');
                    }
                } catch (error) {
                    console.error('Error saving draft session:', error);
                    alert('Fejl ved gemning af kladde. Tjek din internetforbindelse.');
                }
                setSaving(false);
            };

            const startEditSession = (session) => {
                if (!session || !session.id) return;
                setEditingSessionId(session.id);
                setEditSession({
                    date: (session.date || new Date().toISOString().split('T')[0]).toString().slice(0, 10),
                    location: session.location || '',
                    duration: session.duration || '',
                    exercises: session.exercises || [],
                    routes: session.routes || []
                });
            };

            const cancelEditSession = () => {
                setEditingSessionId(null);
                setEditSession(null);
                setUpdating(false);
            };

            const deleteSession = async () => {
                if (!editingSessionId) return;
                const confirmDelete = window.confirm('Er du sikker på, at du vil slette hele sessionen? Dette kan ikke fortrydes.');
                if (!confirmDelete) return;
                setUpdating(true);
                try {
                    const { error } = await supabase
                        .from('sessions')
                        .delete()
                        .eq('id', editingSessionId);
                    if (error) {
                        console.error('Error deleting session:', error);
                        alert('Kunne ikke slette session.');
                    } else {
                        setSessions(sessions.filter(s => s.id !== editingSessionId));
                        cancelEditSession();
                    }
                } catch (e) {
                    console.error('Error deleting session:', e);
                    alert('Kunne ikke slette session.');
                }
                setUpdating(false);
            };

            const updateSession = async () => {
                if (!editingSessionId || !editSession) return;
                setUpdating(true);
                try {
                    const { data: updated, error } = await supabase
                        .from('sessions')
                        .update({
                            date: editSession.date,
                            location: editSession.location,
                            duration: editSession.duration,
                            exercises: editSession.exercises,
                            routes: editSession.routes
                        })
                        .eq('id', editingSessionId)
                        .select()
                        .single();

                    if (error) {
                        console.error('Error updating session:', error);
                        alert('Kunne ikke opdatere session.');
                    } else {
                        setSessions(sortSessions(sessions.map(s => (s.id === editingSessionId ? { ...s, ...updated } : s))));
                        cancelEditSession();
                    }
                } catch (e) {
                    console.error('Error updating session:', e);
                    alert('Kunne ikke opdatere session.');
                }
                setUpdating(false);
            };

            const addEditExercise = () => {
                if (newExercise.trim()) {
                    setEditSession({
                        ...editSession,
                        exercises: [...editSession.exercises, newExercise]
                    });
                    setNewExercise('');
                }
            };

            const addEditExerciseWithReps = (exercise, reps) => {
                if (exercise && reps) {
                    const exerciseText = `${exercise}: ${reps} reps`;
                    setEditSession({
                        ...editSession,
                        exercises: [...editSession.exercises, exerciseText]
                    });
                    setSelectedExercise('');
                    setExerciseReps('');
                }
            };

            const removeEditExercise = (index) => {
                setEditSession({
                    ...editSession,
                    exercises: editSession.exercises.filter((_, i) => i !== index)
                });
            };

            const addEditRoute = () => {
                if (newRoute.color) {
                    setEditSession({
                        ...editSession,
                        routes: [...editSession.routes, { ...newRoute }]
                    });
                    setNewRoute({ color: '', number: '', attempts: '', note: '' });
                }
            };

            const removeEditRoute = (index) => {
                setEditSession({
                    ...editSession,
                    routes: editSession.routes.filter((_, i) => i !== index)
                });
            };

            const getStats = () => {
                const now = new Date();
                let startDate = new Date();
                
                // Set start date based on time period
                if (timePeriod === 'week') {
                    startDate.setDate(now.getDate() - 7);
                } else if (timePeriod === 'month') {
                    startDate.setMonth(now.getMonth() - 1);
                } else if (timePeriod === 'year') {
                    startDate.setFullYear(now.getFullYear() - 1);
                }
                
                const filteredSessions = sessions.filter(s => {
                    const sessionDate = new Date(s.date);
                    return sessionDate >= startDate;
                });

                const totalMinutes = filteredSessions.reduce((acc, s) => {
                    return acc + parseDuration(s.duration);
                }, 0);

                let totalRoutes = 0;
                const colorCounts = {};
                const dailyRoutes = {};
                const dailyColors = {};
                
                filteredSessions.forEach(s => {
                    const sessionDate = new Date(s.date).toISOString().split('T')[0];
                    if (!dailyRoutes[sessionDate]) {
                        dailyRoutes[sessionDate] = 0;
                        dailyColors[sessionDate] = {};
                    }
                    
                    if (s.routes && Array.isArray(s.routes)) {
                        s.routes.forEach(r => {
                            // Only count routes that don't have failure notes
                            const isCompleted = !r.note || !r.note.toLowerCase().includes('fejl');
                            if (isCompleted) {
                                totalRoutes++;
                                dailyRoutes[sessionDate]++;
                                if (r.color) {
                                    colorCounts[r.color] = (colorCounts[r.color] || 0) + 1;
                                    dailyColors[sessionDate][r.color] = (dailyColors[sessionDate][r.color] || 0) + 1;
                                }
                            }
                        });
                    }
                });

                // Sort colors by difficulty (hardest first)
                const sortedColors = Object.entries(colorCounts).sort((a, b) => {
                    const indexA = colorOrder.indexOf(a[0]);
                    const indexB = colorOrder.indexOf(b[0]);
                    return indexA - indexB;
                });

                return {
                    totalHours: Math.floor(totalMinutes / 60),
                    totalMinutes: totalMinutes % 60,
                    totalRoutes,
                    colorCounts: Object.fromEntries(sortedColors),
                    dailyRoutes,
                    dailyColors
                };
            };

            const stats = getStats();

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white flex items-center justify-center">
                        <Icon name="Loader2" size={48} />
                    </div>
                );
            }

            // HOME PAGE
            if (currentPage === 'home') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white p-4 pb-24">
                        <div className="max-w-2xl mx-auto">
                            <header className="mb-8 pt-6">
                                <h1 className="text-4xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                                    Bouldering Tracker
                                </h1>
                                <div className="flex items-center justify-between">
                                    <p className="text-slate-400">
                                        {timePeriod === 'week' ? 'Denne uge' : 
                                         timePeriod === 'month' ? 'Sidste måned' : 'Sidste år'}
                                    </p>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setTimePeriod('week')}
                                            className={`px-3 py-1 rounded-full text-sm font-medium transition-all ${
                                                timePeriod === 'week' 
                                                    ? 'bg-blue-500 text-white' 
                                                    : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                            }`}
                                        >
                                            1 uge
                                        </button>
                                        <button
                                            onClick={() => setTimePeriod('month')}
                                            className={`px-3 py-1 rounded-full text-sm font-medium transition-all ${
                                                timePeriod === 'month' 
                                                    ? 'bg-blue-500 text-white' 
                                                    : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                            }`}
                                        >
                                            1 måned
                                        </button>
                                        <button
                                            onClick={() => setTimePeriod('year')}
                                            className={`px-3 py-1 rounded-full text-sm font-medium transition-all ${
                                                timePeriod === 'year' 
                                                    ? 'bg-blue-500 text-white' 
                                                    : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                            }`}
                                        >
                                            1 år
                                        </button>
                                    </div>
                                </div>
                            </header>

                            <div className="bg-slate-800/50 backdrop-blur rounded-2xl p-6 mb-6 border border-slate-700">
                                <div className="grid grid-cols-2 gap-4 mb-6">
                                    <div className="bg-slate-700/50 rounded-xl p-4">
                                        <div className="flex items-center gap-2 text-slate-400 mb-1">
                                            <Icon name="Clock" size={18} />
                                            <span className="text-sm">Tid klatret</span>
                                        </div>
                                        <div className="text-3xl font-bold text-blue-400">
                                            {stats.totalHours > 0 && `${stats.totalHours}t `}
                                            {stats.totalMinutes}m
                                        </div>
                                    </div>
                                    
                                    <div className="bg-slate-700/50 rounded-xl p-4">
                                        <div className="flex items-center gap-2 text-slate-400 mb-1">
                                            <Icon name="TrendingUp" size={18} />
                                            <span className="text-sm">Boulders taget</span>
                                        </div>
                                        <div className="text-3xl font-bold text-green-400">
                                            {stats.totalRoutes}
                                        </div>
                                    </div>
                                </div>

                                {Object.keys(stats.colorCounts).length > 0 ? (
                                    <div className="space-y-2">
                                        <h3 className="text-sm text-slate-400 mb-3">Ruter (sværest først)</h3>
                                        {Object.entries(stats.colorCounts).map(([color, count]) => (
                                            <div key={color} className="flex items-center justify-between bg-slate-700/30 rounded-lg p-3">
                                                <span className="font-semibold text-lg">{color}</span>
                                                <span className="bg-gradient-to-r from-blue-500 to-purple-500 text-white px-4 py-1 rounded-full text-lg font-bold">
                                                    {count}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center text-slate-400 py-8">
                                        {timePeriod === 'week' ? 'Ingen boulders denne uge endnu! 💪' :
                                         timePeriod === 'month' ? 'Ingen boulders denne måned endnu! 💪' :
                                         'Ingen boulders dette år endnu! 💪'}
                                    </div>
                                )}
                            </div>


                            <button
                                onClick={() => {
                                    setShowNewSession(true);
                                    setCurrentPage('sessions');
                                }}
                                className="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-semibold py-4 rounded-xl mb-4 flex items-center justify-center gap-2 transition-all shadow-lg"
                            >
                                <Icon name="Plus" size={24} />
                                Ny Session
                            </button>
                        </div>

                        {/* Bottom Navigation */}
                        <div className="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700">
                            <div className="max-w-2xl mx-auto px-4 py-3 flex justify-around">
                                <button
                                    onClick={() => setCurrentPage('home')}
                                    className="flex flex-col items-center gap-1 text-blue-400"
                                >
                                    <Icon name="Home" size={24} />
                                    <span className="text-xs font-medium">Hjem</span>
                                </button>
                                <button
                                    onClick={() => setCurrentPage('sessions')}
                                    className="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200"
                                >
                                    <Icon name="Calendar" size={24} />
                                    <span className="text-xs font-medium">Sessioner</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // SESSIONS PAGE
            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white p-4 pb-24">
                    <div className="max-w-2xl mx-auto">
                        <header className="mb-6 pt-6">
                            <h1 className="text-3xl font-bold mb-2">Sessioner</h1>
                            <p className="text-slate-400">Alle dine klatring sessioner</p>
                        </header>

                        {!showNewSession && (
                            <button
                                onClick={() => setShowNewSession(true)}
                                className="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-semibold py-4 rounded-xl mb-6 flex items-center justify-center gap-2 transition-all shadow-lg"
                            >
                                <Icon name="Plus" size={24} />
                                Ny Session
                            </button>
                        )}

                        {showNewSession && (
                            <div className="bg-slate-800/50 backdrop-blur rounded-2xl p-6 mb-6 border border-slate-700">
                                <h2 className="text-2xl font-bold mb-4">Ny Session</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm text-slate-400 mb-2">Dato</label>
                                        <input
                                            type="date"
                                            value={currentSession.date}
                                            onChange={(e) => setCurrentSession({...currentSession, date: e.target.value})}
                                            className="w-full bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm text-slate-400 mb-2">Lokation</label>
                                        <input
                                            type="text"
                                            value={currentSession.location}

                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm text-slate-400 mb-2">Varighed</label>
                                                            <input
                                                                type="text"
                                                                value={editSession?.duration || ''}

                                                                        type="number"
                                                                        value={exerciseReps}
                                                                        onChange={(e) => setExerciseReps(e.target.value)}

                                                                        className="w-full bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"

                                                                            {exercise}

                                                                    ))}

                                                                Gem ændringer

                                                            >
                                                                Annuller
                                                            </button>

                                                                onClick={deleteSession}

                                                            >
                                                                Slet hele session
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div>
                                                        <div className="flex justify-between items-start mb-3">
                                                            <div>
                                                                <h3 className="text-lg font-semibold">
                                                                    {new Date(session.date).toLocaleDateString('da-DK', {
                                                                        day: 'numeric',
                                                                        month: 'long',
                                                                        year: 'numeric'
                                                                    })}

                                                                ) : (
                                                                    <span className="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-sm font-semibold">{session.duration}</span>
                                                                )}

                                                    {session.exercises.map((ex, j) => (
                                                        <div key={j} className="text-sm bg-slate-700/30 rounded px-3 py-1">
                                                            {ex}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {session.routes && session.routes.length > 0 && (
                                            <div>
                                                <h4 className="text-sm font-semibold text-slate-400 mb-2">Ruter</h4>
                                                <div className="space-y-1">
                                                    {session.routes.map((route, j) => (
                                                        <div key={j} className="text-sm bg-slate-700/30 rounded px-3 py-1">
                                                            <span className="font-semibold">{route.color}</span>
                                                            {route.number && <span> {route.number}</span>}
                                                            {route.attempts && <span className="text-slate-400"> ({route.attempts})</span>}
                                                            {route.note && <span className="text-orange-400"> - {route.note}</span>}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                            </div>
                                        )}
                                    </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* Bottom Navigation */}
                        <div className="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700">
                            <div className="max-w-2xl mx-auto px-4 py-3 flex justify-around">
                                <button
                                    onClick={() => setCurrentPage('home')}
                                    className="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200"
                                >
                                    <Icon name="Home" size={24} />
                                    <span className="text-xs font-medium">Hjem</span>
                                </button>
                                <button
                                    onClick={() => setCurrentPage('sessions')}
                                    className="flex flex-col items-center gap-1 text-blue-400"
                                >
                                    <Icon name="Calendar" size={24} />
                                    <span className="text-xs font-medium">Sessioner</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BoulderingTracker />);
    </script>
