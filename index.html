        // Parse duration to minutes
        const parseDuration = (duration) => {
            if (!duration) return 0;
            
            const hoursMatch = duration.match(/(\d+)\s*(t|time|timer|h|hour|hours)/i);
            const minutesMatch = duration.match(/(\d+)\s*(m|min|minut|minutter|minutes?)/i);
            
            const hours = hoursMatch ? parseInt(hoursMatch[1]) : 0;
            const minutes = minutesMatch ? parseInt(minutesMatch[1]) : 0;
            
            return hours * 60 + minutes;
        };

        // Color difficulty order (hardest first)
        const colorOrder = ['Sort', 'Rød', 'Lilla', 'Blå', 'Grøn', 'Orange', 'Gul', 'Hvid', 'Pink'];

        // Farvemapping (kan placeres øverst blandt dine konstanter)
        const colorHexMap = {
          'Grøn': '#2ecc40',
          'Gul': '#f4d03f',
          'Orange': '#e67e22',
          'Blå': '#2980b9',
          'Lilla': '#8e44ad',
          'Rød': '#e74c3c',
          'Sort': '#2d2d2d',
          'Hvid': '#ecf0f1',
          'Pink': '#fd5eaf'
        };

        // Farvemapping (øverst sammen med colorHexMap)
        function getGradient(color) {
          switch(color) {
            case 'Grøn':   return 'linear-gradient(90deg,#236c41 0%,#358356 100%)';
            case 'Gul':    return 'linear-gradient(90deg,#9b8918 0%,#c3b12e 100%)';
            case 'Orange': return 'linear-gradient(90deg,#a76112 0%,#d78f4a 100%)';
            case 'Blå':    return 'linear-gradient(90deg,#20415e 0%,#4d759e 100%)';
            case 'Lilla':  return 'linear-gradient(90deg,#57386d 0%,#8c6ab5 100%)';
            case 'Rød':    return 'linear-gradient(90deg,#b03d2e 0%,#e06648 100%)';
            case 'Sort':   return 'linear-gradient(90deg,#23272e 0%,#45484d 100%)';
            case 'Hvid':   return 'linear-gradient(90deg,#f2f2f2 0%,#dedede 100%)';
            case 'Pink':   return 'linear-gradient(90deg,#a42f8b 0%,#cf7cd8 100%)';
            default:       return 'linear-gradient(90deg,#888 0%,#bbb 100%)';
          }
        }

        // Accordion med smooth height animation (bedste praksis)
        function Accordion({ open, children }) {
            const ref = React.useRef(null);
            const [height, setHeight] = React.useState('0px');
            const [rendered, setRendered] = React.useState(open);
            React.useEffect(() => {
                if (open) setRendered(true);
            }, [open]);
            React.useEffect(() => {
                const el = ref.current;
                if (!el) return;

                if (open) {
                    el.style.height = '0px';
                    requestAnimationFrame(() => {
                        el.style.transition = 'height 0.35s cubic-bezier(.4,0,.2,1)';
                        el.style.height = el.scrollHeight + 'px';
                    });
                    // Efter transition, sæt til auto for layout stability
                    const handler = () => {
                        el.style.height = 'auto';
                        el.removeEventListener('transitionend', handler);
                    };
                    el.addEventListener('transitionend', handler);
                } else {
                    // hvis åben, sæt height til scrollHeight FØR vi sætter til 0, så browser animerer
                    if (el.style.height === 'auto') {
                        el.style.height = el.scrollHeight + 'px';
                        // force reflow for transition
                        void el.offsetHeight;
                    }
                    el.style.transition = 'height 0.35s cubic-bezier(.4,0,.2,1)';
                    el.style.height = '0px';
                    // Unrender children når transition er slut
                    const handler = () => {
                        setRendered(false);
                        el.removeEventListener('transitionend', handler);
                    };
                    el.addEventListener('transitionend', handler);
                }
            }, [open]);

            return (
                <div ref={ref} style={{overflow:'hidden',height:open?'auto':'0px'}}>
                    {rendered && <div>{children}</div>}
                </div>
            );
        }

        // ---------- LOGIN / APP WRAPPER (NY) ----------
        function LoginPage({ onLogin }) {
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [showPopup, setShowPopup] = React.useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError(null);
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      setError(error.message);
    } else {
      onLogin(data.user);
    }
    setLoading(false);
  };

  const handleSignup = async () => {
    setLoading(true);
    setError(null);
    const { error } = await supabase.auth.signUp({ email, password });
    if (error) {
      setError(error.message);
    } else {
      setShowPopup(true);
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white">
      <div className="bg-slate-800 p-8 rounded-2xl shadow-lg w-full max-w-md relative">
        <h1 className="text-2xl font-bold mb-6 text-center">Log ind på Climber.IO</h1>
        <form onSubmit={handleLogin} className="space-y-4">
          <input
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            placeholder="Email"
            className="w-full bg-slate-700 p-3 rounded-lg border border-slate-600 focus:border-blue-500"
            required
          />
          <input
            type="password"
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            placeholder="Adgangskode"
            className="w-full bg-slate-700 p-3 rounded-lg border border-slate-600 focus:border-blue-500"
            required
          />
          {error && <p className="text-red-400 text-sm">{error}</p>}
          <button
            type="submit"
            disabled={loading}
            className="w-full bg-blue-500 hover:bg-blue-600 py-3 rounded-lg font-semibold"
          >
            {loading ? 'Logger ind...' : 'Log ind'}
          </button>
          <button
            onClick={handleSignup}
            type="button"
            disabled={loading}
            className="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-lg font-semibold mt-2"
          >
            Opret ny konto
          </button>
        </form>

        {/* Popup modal */}
        {showPopup && (
          <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
            <div className="bg-slate-800 p-8 rounded-2xl shadow-xl text-center w-80">
              <h3 className="text-xl font-semibold mb-3 text-blue-400">
                Bekræft din email
              </h3>
              <p className="text-slate-300 mb-6">
                Tjek din indbakke for at bekræfte din konto, før du logger ind.
              </p>
              <button
                onClick={() => setShowPopup(false)}
                className="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg"
              >
                Luk
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


function App() {
  const [user, setUser] = React.useState(null);
  const [showWelcome, setShowWelcome] = React.useState(false);

  React.useEffect(() => {
    // Tjek om der allerede findes en aktiv session
    supabase.auth.getSession().then(({ data }) => {
      const activeUser = data.session?.user || null;
      setUser(activeUser);

      // Hvis en bruger er logget ind (fx efter bekræftelse)
      if (activeUser) {
        setShowWelcome(true);
        setTimeout(() => setShowWelcome(false), 3000);
      }
    });

    // Lyt efter login/logout ændringer
    const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
      setUser(session?.user || null);
      if (session?.user) {
        setShowWelcome(true);
        setTimeout(() => setShowWelcome(false), 3000);
      }
    });

    return () => {
      listener.subscription?.unsubscribe();
    };
  }, []);

  if (!user) return <LoginPage onLogin={setUser} />;

  return (
    <>
      <BoulderingTracker user={user} />
      {showWelcome && (
        <div className="fixed bottom-6 right-6 bg-blue-600 text-white px-4 py-3 rounded-xl shadow-lg animate-fade-in">
          <p>Velkommen tilbage, {user.email} 👋</p>
        </div>
      )}
    </>
  );
}

        // ---------- END LOGIN / APP WRAPPER ----------

        // ---------- BoulderingTracker (modificeret til at tage `user` prop) ----------
        const BoulderingTracker = ({ user }) => {
            const [currentPage, setCurrentPage] = useState('home');
            const [sessions, setSessions] = useState([]);
            const [showNewSession, setShowNewSession] = useState(false);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [timePeriod, setTimePeriod] = useState('week'); // 'week', 'month', 'year'
            const [currentSession, setCurrentSession] = useState({
                date: new Date().toISOString().split('T')[0],
                location: '',
                duration: '',
                exercises: [],
                routes: []
            });
            const [newExercise, setNewExercise] = useState('');
            const [newRoute, setNewRoute] = useState({ color: '', number: '', attempts: '', note: '', wallHeight: '5' }); // Added wallHeight to route, default to '5'
            const [selectedExercise, setSelectedExercise] = useState('');
            const [exerciseReps, setExerciseReps] = useState('');
            const [editingSessionId, setEditingSessionId] = useState(null);
            const [editSession, setEditSession] = useState(null);
            const [updating, setUpdating] = useState(false);
            const [showHeightSelector, setShowHeightSelector] = useState(false);


            // New state for locations feature
            const [locationsList, setLocationsList] = useState([]); // To store unique locations
            const [showManualLocationInput, setShowManualLocationInput] = useState(false); // To toggle manual location input field

            // Brug state til at holde styr på åbne sessions
            const [openSessionIds, setOpenSessionIds] = useState([]);

            const toggleSessionOpen = (id) => {
                setOpenSessionIds(ids => ids.includes(id)
                    ? ids.filter(x => x !== id)
                    : [...ids, id]
                );
            };

            const colors = ['Grøn', 'Gul', 'Orange', 'Blå', 'Lilla', 'Rød', 'Sort', 'Hvid', 'Pink'];
            
            // Almindelige klatre-øvelser
            const commonExercises = [
                'Pull ups', 'Dips', 'Push ups', 'External rotation', 'Fingerstyrke', 'Plank'
            ];

            useEffect(() => {
                // Load sessions whenever user changes (ensures we only load data for logged in user)
                if (user) {
                    loadSessions();
                } else {
                    setSessions([]);
                    setLoading(false);
                }
            }, [user]);

            // Helper to group and sort routes by wall height
            const groupAndSortRoutes = (routes) => {
                if (!routes || routes.length === 0) return [];

                // Map routes to include an original index for stable removal during editing
                const routesWithOriginalIndex = routes.map((route, originalIndex) => ({ ...route, originalIndex }));

                const grouped = routesWithOriginalIndex.reduce((acc, route) => {
                    const height = route.wallHeight || '5'; // Default to '5' if not set
                    if (!acc[height]) {
                        acc[height] = [];
                    }
                    acc[height].push(route);
                    return acc;
                }, {});

                // Sort heights: 5, 7, 10 (ascending numerical order)
                const sortedHeights = Object.keys(grouped).sort((a, b) => parseInt(a) - parseInt(b));

                const result = [];
                sortedHeights.forEach(height => {
                    const routesForHeight = grouped[height].sort((a, b) => {
                        const indexA = colorOrder.indexOf(a.color);
                        const indexB = colorOrder.indexOf(b.color);
                        return indexA - indexB;
                    });
                    result.push({ wallHeight: height, routes: routesForHeight });
                });

                return result;
            };

            const sortSessions = (list) => {
                if (!Array.isArray(list)) return [];
                return [...list].sort((a, b) => {
                    const aDraft = !a?.location || !a?.duration;
                    const bDraft = !b?.location || !b?.duration;
                    if (aDraft !== bDraft) return aDraft ? -1 : 1;
                    const aDate = a?.date ? new Date(a.date).getTime() : 0;
                    const bDate = b?.date ? new Date(b.date).getTime() : 0;
                    return bDate - aDate; // newest first
                });
            };

            // Helper to sort locations alphabetically
            const sortLocations = (list) => {
                return [...list].sort((a, b) => a.localeCompare(b, 'da', { sensitivity: 'base' }));
            };

            const loadSessions = async () => {
                setLoading(true);
                try {
                    // Hent kun sessions for den loggede bruger
                    const { data, error } = await supabase
                        .from('sessions')
                        .select('*')
                        .eq('user_id', user.id)
                        .order('date', { ascending: false });
                    
                    if (!error) {
                        setSessions(sortSessions(data));
                        // Udtræk unikke lokationer fra alle sessions
                        const uniqueLocations = [...new Set((data || []).map(s => s.location).filter(Boolean))];
                        setLocationsList(sortLocations(uniqueLocations));
                    } else {
                        console.error('Error loading sessions:', error);
                    }
                } catch (error) {
                    console.error('Error loading sessions:', error);
                }
                setLoading(false);
            };

            // Handler to add a location to the locationsList (for future selection)
            const addLocationToList = (locationName, isEditing = false) => {
                const trimmedLocation = (locationName || '').trim();
                if (!trimmedLocation) return; // Don't add empty locations

                let updatedLocations = locationsList;
                if (!locationsList.includes(trimmedLocation)) {
                    updatedLocations = sortLocations([...locationsList, trimmedLocation]);
                    setLocationsList(updatedLocations);
                }
                
                // Automatically select the newly added/existing location
                if (isEditing) {
                    setEditSession(prev => ({ ...prev, location: trimmedLocation }));
                } else {
                    setCurrentSession(prev => ({ ...prev, location: trimmedLocation }));
                }
                setShowManualLocationInput(false); // Hide manual input after adding or selecting
            };

            const addExercise = () => {
                if (newExercise.trim()) {
                    setCurrentSession({
                        ...currentSession,
                        exercises: [...currentSession.exercises, newExercise]
                    });
                    setNewExercise('');
                }
            };

            const addExerciseWithReps = (exercise, reps) => {
                if (exercise && reps) {
                    const exerciseText = `${exercise}: ${reps} reps`;
                    setCurrentSession({
                        ...currentSession,
                        exercises: [...currentSession.exercises, exerciseText]
                    });
                    setSelectedExercise('');
                    setExerciseReps('');
                }
            };

            const addRoute = () => {
                if (newRoute.color && newRoute.wallHeight) {
                    setCurrentSession({
                        ...currentSession,
                        routes: [...currentSession.routes, { ...newRoute }]
                    });
                    // Keep wallHeight, reset other fields
                    setNewRoute(prev => ({ ...prev, color: '', number: '', attempts: '', note: '' }));
                }
            };

            const saveSession = async () => {
                if (!user) { alert('Du skal være logget ind for at gemme sessioner.'); return; }
                if (currentSession.location && currentSession.duration) {
                    setSaving(true);
                    addLocationToList(currentSession.location); // Add current location to list if new
                    try {
                        const { data: inserted, error } = await supabase
                            .from('sessions')
                            .insert({ ...currentSession, user_id: user.id })
                            .select()
                            .single();

                        if (!error) {
                            setSessions(sortSessions([inserted, ...sessions]));
                            setCurrentSession({
                                date: new Date().toISOString().split('T')[0],
                                location: '',
                                duration: '',
                                exercises: [],
                                routes: []
                            });
                            setNewRoute({ color: '', number: '', attempts: '', note: '', wallHeight: '5' }); // Reset newRoute to default
                            setShowNewSession(false);
                            setCurrentPage('sessions');
                            setShowManualLocationInput(false); // Hide manual input after saving
                        } else {
                            console.error('Error saving session:', error);
                            alert('Fejl ved gemning af session. Tjek din internetforbindelse.');
                        }
                    } catch (error) {
                        console.error('Error saving session:', error);
                        alert('Fejl ved gemning af session. Tjek din internetforbindelse.');
                    }
                    setSaving(false);
                }
            };

            const saveDraftSession = async () => {
                if (!user) { alert('Du skal være logget ind for at gemme sessioner.'); return; }
                setSaving(true);
                addLocationToList(currentSession.location); // Add current location to list if new
                try {
                    const { data: inserted, error } = await supabase
                        .from('sessions')
                        .insert({ ...currentSession, user_id: user.id })
                        .select()
                        .single();

                    if (!error) {
                        setSessions(sortSessions([inserted, ...sessions]));
                        setCurrentSession({
                            date: new Date().toISOString().split('T')[0],
                            location: '',
                            duration: '',
                            exercises: [],
                            routes: []
                        });
                        setNewRoute({ color: '', number: '', attempts: '', note: '', wallHeight: '5' }); // Reset newRoute to default
                        setShowNewSession(false);
                        setCurrentPage('sessions');
                        setShowManualLocationInput(false); // Hide manual input after saving
                    } else {
                        console.error('Error saving draft session:', error);
                        alert('Fejl ved gemning af kladde. Tjek din internetforbindelse.');
                    }
                } catch (error) {
                    console.error('Error saving draft session:', error);
                    alert('Fejl ved gemning af kladde. Tjek din internetforbindelse.');
                }
                setSaving(false);
            };

            const startEditSession = (session) => {
                if (!session || !session.id) return;
                setEditingSessionId(session.id);
                setEditSession({
                    date: (session.date || new Date().toISOString().split('T')[0]).toString().slice(0, 10),
                    location: session.location || '',
                    duration: session.duration || '',
                    exercises: session.exercises || [],
                    routes: session.routes || []
                });
                setNewRoute({ color: '', number: '', attempts: '', note: '', wallHeight: '5' }); // Reset newRoute for edit form to default
                setShowManualLocationInput(false); // Hide manual input when starting edit
            };

            const cancelEditSession = () => {
                setEditingSessionId(null);
                setEditSession(null);
                setUpdating(false);
                setNewRoute({ color: '', number: '', attempts: '', note: '', wallHeight: '5' }); // Reset newRoute to default
                setShowManualLocationInput(false); // Hide manual input when canceling edit
            };

            const deleteSession = async () => {
                if (!editingSessionId) return;
                const confirmDelete = window.confirm('Er du sikker på, at du vil slette hele sessionen? Dette kan ikke fortrydes.');
                if (!confirmDelete) return;
                setUpdating(true);
                try {
                    const { error } = await supabase
                        .from('sessions')
                        .delete()
                        .eq('id', editingSessionId);
                    if (error) {
                        console.error('Error deleting session:', error);
                        alert('Kunne ikke slette session.');
                    } else {
                        setSessions(sessions.filter(s => s.id !== editingSessionId));
                        cancelEditSession();
                    }
                } catch (e) {
                    console.error('Error deleting session:', e);
                    alert('Kunne ikke slette session.');
                }
                setUpdating(false);

                        .select()
                        .single();

                        alert('Kunne ikke opdatere session.');

                                if (r.color) {

                                    dailyColors[sessionDate][r.color] = (dailyColors[sessionDate][r.color] || 0) + 1;
                                }
                            }
                        });
                    }
                });

                const sortedColors = Object.entries(colorCounts).sort((a, b) => {
                    const indexA = colorOrder.indexOf(a[0]);
                    const indexB = colorOrder.indexOf(b[0]);
                    return indexA - indexB;
                });

                return {

                                            { key: 'pull ups', label: 'Pull ups', colorClass: 'text-cyan-400' },
                                            { key: 'dips', label: 'Dips', colorClass: 'text-amber-400' },
                                            { key: 'push ups', label: 'Push ups', colorClass: 'text-amber-400' },

                                        ];
                                        // Hent brugerdefinerede øvelser fra sessions (optionelt kan dette udvides til UI senere)
                                        // Her samler vi alle øvelsesnavne fundet i sessions og kan vælge at tracke dem også
                                        const now = new Date();
                                        let startDate = new Date();
                                        if (timePeriod === 'week') startDate.setDate(now.getDate() - 7);
                                        else if (timePeriod === 'month') startDate.setMonth(now.getMonth() - 1);
                                        else if (timePeriod === 'year') startDate.setFullYear(now.getFullYear() - 1);
                                        const filtered = sessions.filter(s => new Date(s.date) >= startDate);

                                        const parseReps = (label) => {
                                            const m = label.match(/(\d+)\s*reps/i) || label.match(/^(\d+)/);
                                            return m ? parseInt(m[1], 10) : 0;
                                        };
                                        const sumFor = (needle) => filtered.reduce((sum, s) => {
                                            const arr = Array.isArray(s.exercises) ? s.exercises : [];
                                            return sum + arr.reduce((acc, e) => {
                                                if (typeof e === 'string' && e.toLowerCase().includes(needle)) {
                                                    return acc + parseReps(e);
                                                }
                                                return acc;
                                            }, 0);
                                        }, 0);

                                        // Muliggør automatisk tracking af andre øvelser som allerede er brugt i sessions

                                        const discovered = new Map();
                                        filtered.forEach(s => {

                                            arr.forEach(e => {

                                                const nameMatch = lower.match(/^([a-zæøå\s]+?):/) || lower.match(/^([a-zæøå]+(?:\s+[a-zæøå]+)?)/);

                                        const dynamic = Array.from(discovered.keys())

                                                    value={newRoute.number}
                                                    onChange={(e) => setNewRoute({...newRoute, number: e.target.value})}
                                                    placeholder="Nummer (valgfrit)"
                                                    className="flex-1 bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                />
                                                <input
                                                    type="number"
                                                    value={newRoute.attempts}
                                                    onChange={(e) => setNewRoute({...newRoute, attempts: e.target.value})}

                                                >
                                                    <Icon name="Plus" size={24} />
                                                    Tilføj rute

                                                            <div
                                                                key={i}
                                                                className="rounded-lg p-2 text-sm mb-1 flex items-center shadow border"
                                                                style={{ background: getGradient(route.color), color: route.color === 'Hvid' ? '#232323' : '#fff', border: '1px solid rgba(30,30,40,0.14)', boxShadow: '0 1.5px 6px 0 rgba(20,20,36,0.11)', fontWeight: 500 }}
                                                            >
                                                                <span className="font-semibold" style={{fontSize: '1em', fontWeight:'500'}}>{route.color}</span>
                                                                {route.number && <span style={{marginLeft:'0.4em'}}>#{route.number}</span>}
                                                                {route.attempts && <span className="text-slate-200/85" style={{marginLeft:'0.5em'}}> ({route.attempts})</span>}
                                                                {route.note && <span className="text-orange-200/95" style={{marginLeft:'0.5em'}}> - {route.note}</span>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-4">
                                        <button
                                            onClick={saveSession}
                                            disabled={saving}
                                            className="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 disabled:opacity-50 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2"
                                        >
                                            {saving ? <Icon name="Loader2" size={20} /> : 'Gem Session'}
                                        </button>
                                        <button
                                            onClick={saveDraftSession}
                                            disabled={saving}
                                            className="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white font-semibold py-3 rounded-xl"
                                        >
                                            Gem som kladde
                                        </button>
                                        <button
                                            onClick={() => setShowNewSession(false)}
                                            disabled={saving}
                                            className="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white font-semibold py-3 rounded-xl"
                                        >
                                            Annuller
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {!showNewSession && (
                            <div className="space-y-4">
                                {sessions.length === 0 ? (
                                    <div className="text-center text-slate-400 py-12">
                                        Ingen sessioner endnu. Tilføj din første! 💪
                                    </div>
                                ) : (
                                    sessions
                                        .filter(session => editingSessionId == null || editingSessionId === session.id)
                                        .map((session, i) => (
                                            <div key={session.id || i} className="bg-slate-800/50 backdrop-blur rounded-2xl p-5 border border-slate-700 mb-2">
                                                {editingSessionId === session.id ? (
                                                    <div className="space-y-4">
                                                        <div>
                                                            <label className="block text-sm text-slate-400 mb-2">Dato</label>
                                                            <input
                                                                type="date"
                                                                value={editSession?.date || ''}
                                                                onChange={(e) => setEditSession({ ...editSession, date: e.target.value })}
                                                                className="w-full bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm text-slate-400 mb-2">Lokation</label>
                                                            <div className="flex gap-2 items-center">
                                                                {locationsList.length > 0 && !showManualLocationInput ? (
                                                                    <select
                                                                        value={editSession?.location || ''}
                                                                        onChange={(e) => {
                                                                            setEditSession({ ...editSession, location: e.target.value });
                                                                            setShowManualLocationInput(false); // Hide manual input if an option is selected
                                                                        }}
                                                                        className="flex-1 bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                                    >
                                                                        <option value="">Vælg eksisterende lokation</option>
                                                                        {locationsList.map(loc => (
                                                                            <option key={loc} value={loc}>{loc}</option>
                                                                        ))}
                                                                    </select>
                                                                ) : null}

                                                                {showManualLocationInput || locationsList.length === 0 ? (
                                                                    <div className="flex flex-1 gap-2">
                                                                        <input
                                                                            type="text"
                                                                            value={editSession?.location || ''}
                                                                            onChange={(e) => setEditSession({ ...editSession, location: e.target.value })}
                                                                            onKeyPress={(e) => e.key === 'Enter' && addLocationToList(editSession?.location, true)}
                                                                            placeholder="Skriv lokation"
                                                                            className="flex-1 bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                                        />
                                                                        <button
                                                                            onClick={() => addLocationToList(editSession?.location, true)}
                                                                            disabled={!editSession?.location?.trim()}
                                                                            className="bg-blue-500 hover:bg-blue-600 px-4 rounded-lg disabled:opacity-50"
                                                                            title="Tilføj lokation til listen"
                                                                        >
                                                                            <Icon name="Plus" size={20} />
                                                                        </button>
                                                                        {showManualLocationInput && locationsList.length > 0 && (
                                                                            <button
                                                                                onClick={() => {
                                                                                    setShowManualLocationInput(false);
                                                                                }}
                                                                                className="bg-slate-700 hover:bg-slate-600 px-4 rounded-lg text-slate-300"
                                                                                title="Annuller manuel indtastning"
                                                                            >
                                                                                <Icon name="X" size={20} />
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                ) : (
                                                                    <button
                                                                        onClick={() => setShowManualLocationInput(true)}
                                                                        className="bg-blue-500 hover:bg-blue-600 px-4 py-3 rounded-lg"
                                                                        title="Tilføj ny lokation"
                                                                    >
                                                                        <Icon name="Plus" size={20} />
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm text-slate-400 mb-2">Varighed</label>
                                                            <input
                                                                type="text"
                                                                value={editSession?.duration || ''}
                                                                onChange={(e) => setEditSession({ ...editSession, duration: e.target.value })}
                                                                className="w-full bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                            />
                                                        </div>

                                                        <div>
                                                            <label className="block text-sm text-slate-400 mb-2">Øvelser</label>
                                                            
                                                            {/* Øvelses-knapper */}
                                                            <div className="mb-4">
                                                                <div className="mb-3">
                                                                    <input
                                                                        type="number"
                                                                        value={exerciseReps}
                                                                        onChange={(e) => setExerciseReps(e.target.value)}
                                                                        placeholder="Antal reps"
                                                                        className="w-full bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                                    />
                                                                </div>
                                                                
                                                                <div className="grid grid-cols-2 gap-2 mb-3">
                                                                    {commonExercises.map((exercise) => (
                                                                        <button
                                                                            key={exercise}
                                                                            onClick={() => setSelectedExercise(exercise)}
                                                                            className={`p-2 rounded-lg text-sm font-medium transition-all ${
                                                                                selectedExercise === exercise
                                                                                    ? 'bg-blue-500 text-white'
                                                                                    : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                                                            }`}
                                                                        >
                                                                            {exercise}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                                
                                                                {selectedExercise && exerciseReps && (
                                                                    <div className="mb-3">
                                                                        <button
                                                                            onClick={() => addEditExerciseWithReps(selectedExercise, exerciseReps)}
                                                                            className="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-semibold py-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg"
                                                                        >
                                                                            <Icon name="Plus" size={24} />
                                                                            Tilføj {selectedExercise}: {exerciseReps} reps
                                                                        </button>
                                                                    </div>
                                                                )}
                                                            </div>

                                                            {/* Manuel tilføjelse */}
                                                            <div className="flex gap-2 mb-2">
                                                                <input
                                                                    type="text"
                                                                    value={newExercise}
                                                                    onChange={(e) => setNewExercise(e.target.value)}
                                                                    onKeyPress={(e) => e.key === 'Enter' && addEditExercise()}
                                                                    placeholder="Eller skriv manuelt (f.eks. 10 pull ups)"
                                                                    className="flex-1 bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                                />
                                                                <button
                                                                    onClick={addEditExercise}
                                                                    className="bg-blue-500 hover:bg-blue-600 px-4 rounded-lg"
                                                                >
                                                                    <Icon name="Plus" size={20} />
                                                                </button>
                                                            </div>
                                                            
                                                            {editSession?.exercises?.map((ex, i) => (
                                                                <div key={i} className="flex items-center gap-2 bg-slate-700/50 rounded-lg p-2 mb-1 text-sm">
                                                                    <span className="flex-1">{ex}</span>
                                                                    <button
                                                                        onClick={() => removeEditExercise(i)}
                                                                        className="text-red-400 hover:text-red-300"
                                                                    >
                                                                        <Icon name="X" size={16} />
                                                                    </button>
                                                                </div>
                                                            ))}
                                                        </div>

                                                        {/* NEW: Wall Height for route, moved here */}
                                                        <div className="pt-2"> {/* Added padding top for spacing */}
                                                            <label className="block text-sm text-slate-400 mb-2">Væghøjde for nye ruter</label>
                                                            <select
                                                                value={newRoute.wallHeight}
                                                                onChange={(e) => setNewRoute({...newRoute, wallHeight: e.target.value})}
                                                                className="w-full bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                            >
                                                                <option value="5">5 meter</option>
                                                                <option value="7">7 meter</option>
                                                                <option value="10">10 meter</option>
                                                            </select>
                                                        </div>
                                                        {/* END NEW */}

                                                        <div>
                                                            <label className="block text-sm text-slate-400 mb-2">Ruter</label>
                                                            <div className="space-y-2 mb-2">
                                                                <select
                                                                    value={newRoute.color}
                                                                    onChange={(e) => setNewRoute({...newRoute, color: e.target.value})}
                                                                    className="w-full bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                                >
                                                                    <option value="">Vælg farve</option>
                                                                    {colors.map(c => <option key={c} value={c}>{c}</option>)}
                                                                </select>
                                                                
                                                                <div className="flex gap-2">
                                                                    <input
                                                                        type="text"
                                                                        value={newRoute.number}
                                                                        onChange={(e) => setNewRoute({...newRoute, number: e.target.value})}
                                                                        placeholder="Nummer (valgfrit)"
                                                                        className="flex-1 bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                                    />
                                                                    <input
                                                                        type="number"
                                                                        value={newRoute.attempts}
                                                                        onChange={(e) => setNewRoute({...newRoute, attempts: e.target.value})}
                                                                        placeholder="Forsøg"
                                                                        className="w-24 bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                                    />
                                                                </div>
                                                                
                                                                <input
                                                                    type="text"
                                                                    value={newRoute.note}
                                                                    onChange={(e) => setNewRoute({...newRoute, note: e.target.value})}
                                                                    placeholder="Note (f.eks. 'Fejl - ikke nok fingerstyrke')"
                                                                    className="w-full bg-slate-700 rounded-lg p-3 text-white border border-slate-600 focus:border-blue-500 focus:outline-none"
                                                                />
                                                                
                                                                {newRoute.color && newRoute.wallHeight && (
                                                                    <button
                                                                        onClick={addEditRoute}
                                                                        className="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-semibold py-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg"
                                                                    >
                                                                        <Icon name="Plus" size={24} />
                                                                        Tilføj rute
                                                                    </button>
                                                                )}
                                                            </div>
                                                            
                                                            <div className="space-y-3 mt-4">
                                                                {groupAndSortRoutes(editSession?.routes).map((heightGroup, hIdx) => (
                                                                    <div key={hIdx}>
                                                                        <h5 className="text-sm font-semibold text-slate-400 mb-2">{heightGroup.wallHeight} meter væg</h5>
                                                                        <div className="space-y-1">
                                                                            {heightGroup.routes.map((route) => (
                                                                                <div
                                                                                    key={route.originalIndex}
                                                                                    className="flex items-center gap-2 rounded-lg p-2 text-sm mb-1 shadow border"
                                                                                    style={{ background: getGradient(route.color), color: route.color === 'Hvid' ? '#232323' : '#fff', border: '1px solid rgba(30,30,40,0.14)', boxShadow: '0 1.5px 6px 0 rgba(20,20,36,0.11)', fontWeight: 500 }}
                                                                                >
                                                                                    <div className="flex-1">
                                                                                        <span className="font-semibold" style={{fontSize: '1em', fontWeight:'500'}}>{route.color}</span>
                                                                                        {route.number && <span style={{marginLeft:'0.4em'}}>#{route.number}</span>}
                                                                                        {route.attempts && <span className="text-slate-200/85" style={{marginLeft:'0.5em'}}> ({route.attempts})</span>}
                                                                                        {route.note && <span className="text-orange-200/95" style={{marginLeft:'0.5em'}}> - {route.note}</span>}
                                                                                    </div>
                                                                                    <button
                                                                                        onClick={() => removeEditRoute(route.originalIndex)}
                                                                                        className="text-red-300 hover:text-red-200"
                                                                                    >
                                                                                        <Icon name="X" size={16} />
                                                                                    </button>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>

                                                        <div className="flex gap-2 pt-2">
                                                            <button
                                                                onClick={updateSession}
                                                                disabled={updating}
                                                                className="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 disabled:opacity-50 text-white font-semibold py-3 rounded-xl"
                                                            >
                                                                Gem ændringer
                                                            </button>
                                                            <button
                                                                onClick={cancelEditSession}
                                                                disabled={updating}
                                                                className="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white font-semibold py-3 rounded-xl"
                                                            >
                                                                Annuller
                                                            </button>
                                                            <button
                                                                onClick={deleteSession}
                                                                disabled={updating}
                                                                className="flex-1 bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-semibold py-3 rounded-xl"
                                                            >
                                                                Slet hele session
                                                            </button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <button className="w-full text-left" onClick={() => toggleSessionOpen(session.id)}>
                                                            <div className="flex justify-between items-start cursor-pointer">
                                                                <div>
                                                                    <h3 className="text-lg font-semibold">
                                                                        {new Date(session.date).toLocaleDateString('da-DK', {
                                                                            day: 'numeric',
                                                                            month: 'long',
                                                                            year: 'numeric'
                                                                        })}
                                                                    </h3>
                                                                    <p className="text-slate-400 text-sm">{session.location}</p>
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    {(!session.location || !session.duration) ? (
                                                                        <span className="bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-full text-sm font-semibold">Kladde</span>
                                                                    ) : (
                                                                        <span className="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-sm font-semibold">{session.duration}</span>
                                                                    )}
                                                                    <span className="ml-4 text-2xl text-blue-200">{openSessionIds.includes(session.id) ? '−' : '+'}</span>
                                                                    {session.id && (
                                                                        <button type="button" onClick={e => {e.stopPropagation(); startEditSession(session)}} className="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200" title="Rediger">
                                                                            <Icon name="Edit" size={18} />
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </button>
                                                        {openSessionIds.includes(session.id) && (
                                                            <>
                                                                {session.exercises && session.exercises.length > 0 && (
                                                                    <div className="mb-3">
                                                                        <h4 className="text-sm font-semibold text-slate-400 mb-2">Øvelser</h4>
                                                                        <div className="space-y-1">
                                                                            {session.exercises.map((ex, j) => (
                                                                                <div key={j} className="text-sm bg-slate-700/30 rounded px-3 py-1">{ex}</div>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                )}
                                                                {session.routes && session.routes.length > 0 && (
                                                                    <div className="space-y-3 mt-4">
                                                                        <h4 className="text-sm font-semibold text-slate-400 mb-2">Ruter</h4>
                                                                        {groupAndSortRoutes(session.routes).map((heightGroup, hIdx) => (
                                                                            <div key={hIdx}>
                                                                                <h5 className="text-sm font-semibold text-slate-400 mb-2">{heightGroup.wallHeight} meter væg</h5>
                                                                                <div className="space-y-1">
                                                                                    {heightGroup.routes.map((route, j) => (
                                                                                        <div
                                                                                            key={j}
                                                                                            className="text-sm rounded-lg px-3 py-2 mb-1 shadow border"
                                                                                            style={{ background: getGradient(route.color), color: route.color === 'Hvid' ? '#232323' : '#fff', border: '1px solid rgba(30,30,40,0.14)', boxShadow: '0 1.5px 6px 0 rgba(20,20,36,0.11)', fontWeight: 500 }}
                                                                                        >
                                                                                            <span className="font-semibold" style={{fontSize: '1em', fontWeight:'500'}}>{route.color}</span>
                                                                                            {route.number && <span style={{marginLeft:'0.4em'}}>#{route.number}</span>}
                                                                                            {route.attempts && <span className="text-slate-200/85" style={{marginLeft:'0.5em'}}> ({route.attempts})</span>}
                                                                                            {route.note && <span className="text-orange-200/95" style={{marginLeft:'0.5em'}}> - {route.note}</span>}
                                                                                        </div>
                                                                                    ))}
                                                                                </div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </>
                                                        )}
                                                    </>
                                                )}
                                            </div>
                                        ))
                                )}
                            </div>
                        )}

                        {/* Bottom Navigation */}
                        <div className="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700">
                            <div className="max-w-2xl mx-auto px-4 py-3 flex justify-around">
                                <button
                                    onClick={() => setCurrentPage('home')}
                                    className="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200"
                                >
                                    <Icon name="Home" size={24} />
                                    <span className="text-xs font-medium">Hjem</span>
                                </button>
                                <button
                                    onClick={() => setCurrentPage('sessions')}
                                    className="flex flex-col items-center gap-1 text-blue-400"
                                >
                                    <Icon name="Calendar" size={24} />
                                    <span className="text-xs font-medium">Sessioner</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        // ---------- END BoulderingTracker ----------

        // RENDER APP (brug App wrapper som håndterer auth)
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
